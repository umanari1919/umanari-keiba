name: modern-stack-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: auto
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Resolve modern stack
        run: uv sync --python ${{ matrix.python-version }} --extra core --extra research --extra dev
      - name: Compile research lab
        run: uv run python -m compileall -q tools/research_dashboard
      - name: Ruff runtime-safety gate
        run: uv run ruff check --select F,E9 tools/research_dashboard tests/test_modern_stack.py
      - name: Modern stack tests
        run: uv run pytest -q tests/test_modern_stack.py
