name: atlas-jvlink-acquire-002

on:
  pull_request:
    paths:
      - "tools/atlas_jvlink_capture.py"
      - "tools/ATLAS-JRA-*.cmd"
      - "tests/test_atlas_jvlink_capture.py"
      - "docs/ATLAS_JVLINK_002.md"
      - "pyproject.toml"
      - ".github/workflows/atlas-jvlink-acquire-002.yml"
      - "tools/atlas_inbox.py"
      - "atlas/sql/001_init.sql"
  push:
    branches: [main]
    paths:
      - "tools/atlas_jvlink_capture.py"
      - "tests/test_atlas_jvlink_capture.py"
      - ".github/workflows/atlas-jvlink-acquire-002.yml"

permissions:
  contents: read

jobs:
  simulated-com:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - name: Python syntax and imports
        run: python -m py_compile tools/atlas_jvlink_capture.py tools/atlas_inbox.py tests/test_atlas_jvlink_capture.py
      - name: Simulated COM rights, checksums, retry and chunk integrity
        run: python -m unittest discover -s tests -p "test_atlas_jvlink_capture.py" -v

  synthetic-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci_synthetic
          POSTGRES_DB: neo_jizo_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d neo_jizo_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: neo_jizo_atlas
      PGUSER: atlas_ci
      PGPASSWORD: atlas_ci_synthetic
      ATLAS_PG_DSN: postgresql://atlas_ci:atlas_ci_synthetic@127.0.0.1:5432/neo_jizo_atlas
      ATLAS_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Optional PostgreSQL adapter dependency
        run: python -m pip install "psycopg[binary]==3.3.2"
      - name: PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Create isolated synthetic-only ATLAS database schema
        run: psql -X -v ON_ERROR_STOP=1 -f atlas/sql/001_init.sql
      - name: Mock JV-Link -> ATLAS inbox -> actual PG integration
        run: python -m unittest discover -s tests -p "test_atlas_jvlink_capture.py" -v
      - name: Confirm no data was canonically promoted
        run: psql -X -v ON_ERROR_STOP=1 -c "SELECT count(*) AS canon_rows FROM atlas.race_observation"
