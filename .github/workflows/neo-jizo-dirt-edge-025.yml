name: neo-jizo-dirt-edge-025

on:
  pull_request:
    paths:
      - "src/neo_jizo_dirt_edge.py"
      - "src/neo_jizo_dirt_edge_adapter.py"
      - "tests/test_neo_jizo_dirt_edge.py"
      - "tests/test_neo_jizo_dirt_edge_adapter.py"
      - "docs/NEO_JIZO_DIRT_EDGE_025.md"
      - "NEXT_MISSION.md"
      - ".github/workflows/neo-jizo-dirt-edge-025.yml"
  push:
    branches: [main]
    paths:
      - "src/neo_jizo_dirt_edge.py"
      - "src/neo_jizo_dirt_edge_adapter.py"
      - "tests/test_neo_jizo_dirt_edge.py"
      - "tests/test_neo_jizo_dirt_edge_adapter.py"

permissions:
  contents: read

jobs:
  evaluation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/neo_jizo_dirt_edge.py src/neo_jizo_dirt_edge_adapter.py
      - name: Install pytest
        run: python -m pip install pytest==9.1.0
      - name: Test NEO JIZO dirt edge contract
        run: python -m pytest -q tests/test_neo_jizo_dirt_edge.py tests/test_neo_jizo_dirt_edge_adapter.py
