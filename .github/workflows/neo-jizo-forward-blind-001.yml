name: neo-jizo-forward-blind-001

on:
  pull_request:
    paths:
      - "src/forward_blind.py"
      - "src/weekend_personal_forecast.py"
      - "tests/test_forward_blind.py"
      - ".github/workflows/neo-jizo-forward-blind-001.yml"
  push:
    branches: [main]
    paths:
      - "src/forward_blind.py"
      - "src/weekend_personal_forecast.py"
      - "tests/test_forward_blind.py"
      - ".github/workflows/neo-jizo-forward-blind-001.yml"

permissions:
  contents: read

jobs:
  forward-freeze:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/forward_blind.py src/weekend_personal_forecast.py tests/test_forward_blind.py
      - name: Synthetic no-DB contract tests
        run: python -m unittest discover -s tests -p 'test_forward_blind.py' -v
