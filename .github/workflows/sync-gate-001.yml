name: sync-gate-001

on:
  pull_request:
    paths:
      - "tools/sync_gate_001.ps1"
      - ".github/workflows/sync-gate-001.yml"
  push:
    branches: [main]
    paths:
      - "tools/sync_gate_001.ps1"
      - ".github/workflows/sync-gate-001.yml"

permissions:
  contents: read

jobs:
  powershell-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run SYNC-GATE-001 self-test
        shell: pwsh
        run: ./tools/sync_gate_001.ps1 -SelfTest
