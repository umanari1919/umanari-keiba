name: neo-jizo-forward-results-002

on:
  pull_request:
    paths:
      - "src/forward_results.py"
      - "tests/test_forward_results.py"
      - "docs/NEO_JIZO_FORWARD_RESULT_002.md"
      - ".github/workflows/neo-jizo-forward-results-002.yml"
  push:
    branches: [main]
    paths:
      - "src/forward_results.py"
      - "tests/test_forward_results.py"
      - ".github/workflows/neo-jizo-forward-results-002.yml"

permissions:
  contents: read

jobs:
  readonly-result-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile result adapter and dependencies
        run: python -m py_compile src/forward_results.py src/forward_blind.py src/sample_extract.py tests/test_forward_results.py
      - name: Synthetic result reconciliation tests (no database)
        run: python -m unittest discover -s tests -p 'test_forward_results.py' -v
