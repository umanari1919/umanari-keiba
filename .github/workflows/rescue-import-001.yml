name: rescue-import-001

on:
  pull_request:
    paths:
      - "tools/rescue_local_unborn_repo.ps1"
      - ".github/workflows/rescue-import-001.yml"
  push:
    branches: [main]
    paths:
      - "tools/rescue_local_unborn_repo.ps1"
      - ".github/workflows/rescue-import-001.yml"

permissions:
  contents: read

jobs:
  powershell-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run RESCUE-IMPORT-001 self-test
        shell: pwsh
        run: ./tools/rescue_local_unborn_repo.ps1 -SelfTest