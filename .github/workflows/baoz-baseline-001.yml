name: baoz-baseline-001

on:
  pull_request:
    paths:
      - "src/baoz_baseline.py"
      - "tests/test_baoz_baseline.py"
      - "docs/BAOZ_*.md"
      - ".github/workflows/baoz-baseline-001.yml"
  push:
    branches: [main]
    paths:
      - "src/baoz_baseline.py"
      - "tests/test_baoz_baseline.py"

permissions:
  contents: read

jobs:
  baseline-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/baoz_baseline.py
      - name: Install pytest
        run: python -m pip install pytest==9.1.0
      - name: Test baseline contract
        run: python -m pytest -q tests/test_baoz_baseline.py
