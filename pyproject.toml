[project]
name = "the-jockey-research-lab"
version = "0.1.0"
description = "THE JOCKEY governed autonomous horse-racing research lab"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
core = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "duckdb==1.5.6",
  "polars==1.44.2",
  "pyarrow==25.0.1",
  "pydantic==2.13.5",
  "pandera==0.33.1",
]
research = [
  "scikit-learn==1.9.1",
  "optuna==5.0.0",
]
model = [
  "catboost==1.2.10",
]
mlops = [
  "mlflow==3.16.0",
]
# Explicit install only. Rights-approved ATLAS inbox -> new PG database.
ingest = [
  "psycopg[binary]==3.3.2",
]
# Windows-only SDK 5.0.0 JV-Link COM support. No automatic SDK installation.
jvlink = [
  "pywin32==312; sys_platform == 'win32'",
]
dev = [
  "ruff==0.16.8",
  "pytest==9.1.0",
  "pytest-xdist==3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "data", "artifacts", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# The modern-stack environment intentionally requires Python 3.12+ because
# NumPy 2.5.x dropped Python 3.11. Existing lab scripts may still use older
# fallback environments, but they are outside this modern uv environment.
# uv.lock is intentionally not hand-authored. Generate it only on a real machine
# after `uv sync --extra core --extra research --extra dev` resolves successfully.
# Model and MLOps extras are isolated so they cannot block the core research lab.
