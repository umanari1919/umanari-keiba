[project]
name = "the-jockey-research-lab"
version = "0.1.0"
description = "THE JOCKEY governed autonomous horse-racing research lab"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
core = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "duckdb==1.5.6",
  "polars==1.44.2",
  "pyarrow==25.0.1",
  "pydantic==2.13.5",
  "pandera==0.33.1",
]
research = [
  "scikit-learn==1.9.1",
  "optuna==5.0.0",
]
model = [
  "catboost==1.2.10",
]
mlops = [
  "mlflow==3.16.0",
]
dev = [
  "ruff==0.16.8",
  "pytest==9.1.0",
  "pytest-xdist==3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data", "artifacts", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# uv.lock is intentionally not hand-authored. Generate it only on a real machine
# after `uv sync --extra core --extra research --extra dev` resolves successfully.
# Model and MLOps extras are isolated so they cannot block the core research lab.
