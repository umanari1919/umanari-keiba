name = "nar_to_base44"
goal = "Convert NAR prediction outputs into validated Base44 JSON without changing application code."

steps = [
  "Inspect available NAR input files, prediction artifacts, and README notes before editing.",
  "Define the minimum prediction fields needed for NAR Prediction, EV, and 激走馬 ranking.",
  "Map prediction fields into the Base44 JSON contract with stable keys and explicit null handling.",
  "Validate that generated JSON can be parsed locally before it is handed to API or frontend work.",
  "Record assumptions and unresolved data gaps for the next implementation step."
]

verification = [
  "git status --short",
  "find workflows -maxdepth 1 -type f -name '*.toml' -print | sort",
  "python -m json.tool <path-to-generated-base44-json> >/dev/null"
]

expected_outputs = [
  "A documented NAR-to-Base44 field mapping.",
  "A locally parseable Base44 JSON artifact or fixture.",
  "A short list of missing inputs, assumptions, and next implementation tasks."
]
