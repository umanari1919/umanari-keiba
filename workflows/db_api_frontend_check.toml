name = "db_api_frontend_check"
goal = "Check database contracts, FastAPI `/docs`, and frontend-facing Base44 JSON assumptions before integration changes."

steps = [
  "Inspect existing database, API, and frontend files before making changes.",
  "List the data fields required by NAR Prediction, EV, 激走馬, and Base44 JSON consumers.",
  "Compare database schema or fixtures against API response models and frontend expectations.",
  "Start or inspect FastAPI locally and confirm `/docs` is reachable when the app exists.",
  "Validate sample API responses against the Base44 JSON contract.",
  "Document mismatches before proposing implementation work."
]

verification = [
  "git status --short",
  "python -m compileall .",
  "pytest -q",
  "uvicorn <module>:<app> --reload",
  "curl -f http://127.0.0.1:8000/docs"
]

expected_outputs = [
  "A DB/API/frontend contract checklist.",
  "Confirmation that FastAPI `/docs` is reachable, or a documented reason it is not yet available.",
  "A list of schema, response, or frontend mismatches to fix in later application-code work."
]
